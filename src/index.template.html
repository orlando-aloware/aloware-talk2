<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">
    <link rel="icon" type="image/png" sizes="128x128" id="favicon128">
    <link rel="icon" type="image/png" sizes="96x96" id="favicon96">
    <link rel="icon" type="image/png" sizes="32x32" id="favicon32">
    <link rel="icon" type="image/png" sizes="16x16" id="favicon16">
    <link rel="icon" type="image/ico" id="faviconIco">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.0.0/animate.min.css" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- DO NOT touch the following DIV -->
    <div id="q-app"></div>

    <script>
      if ('<%= process.env.INTERCOM_APP_ID %>' !== '') {
        var APP_ID = '<%= process.env.INTERCOM_APP_ID %>';

        (function(){var w=window;var ic=w.Intercom;if(typeof ic==="function"){ic('reattach_activator');ic('update',w.intercomSettings);}else{var d=document;var i=function(){i.c(arguments);};i.q=[];i.c=function(args){i.q.push(args);};w.Intercom=i;var l=function(){var s=d.createElement('script');s.type='text/javascript';s.async=true;s.src='https://widget.intercom.io/widget/' + APP_ID;var x=d.getElementsByTagName('script')[0];x.parentNode.insertBefore(s, x);};if(document.readyState==='complete'){l();}else if(w.attachEvent){w.attachEvent('onload',l);}else{w.addEventListener('load',l,false);}}})();
      }
    </script>

    <script>
    // Favicon change script
    const resellerHostnames = ['simpsocial', 'aloreseller']
    const faviconElements = ['favicon128', 'favicon96', 'favicon32', 'favicon16', 'faviconIco']

    // Check if current hostname is one of the resellers
    // const isReseller = resellerHostnames.some(hostname => window?.location?.hostname?.includes(hostname));
    const isReseller = true

    function updateFavicon(elementId, filename) {
      document.getElementById(elementId).href = filename
    }

    if (isReseller) {
      // If the hostname matches a reseller, set all favicon links to the same file
      faviconElements.forEach(element => updateFavicon(element, 'company-357-favicon.ico'))
    } else {
      // If not a reseller, determine favicon path based on the environment
      const env = process.env.APP_ENV
      faviconElements.forEach(element => {
        const size = element.replace('favicon', '')
        const isIco = size === 'Ico'
        const suffix = isIco ? 'ico' : `${size}x${size}.png`
        const filename = env !== "production" ? `favicon-dev-${suffix}` : `favicon-${suffix}`
        updateFavicon(element, filename)
      })
    }
  </script>
  </body>
</html>
