name: Environment Destruction

on:
  push:
    branches:
      - 'feature/PLAT-1002/add-pipeline-v2'
  pull_request:
    branches:
      - develop
    types: [closed, open]

jobs:
  trigger:
#    if: github.event.pull_request.merged == true
    name: jenkins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - uses: jwalton/gh-find-current-pr@v1
        id: findPr
        with:
          state: open
      - name: trigger destruction workflow
        uses: wei/curl@master
        with:
          args: -X POST https://jenkins.alodev.org/job/DevOps/job/talk2_destruction_workflow/buildWithParameters?PR_NUMBER=${{ steps.findPr.outputs.pr }} --user ${{ secrets.jenkins_user }}:${{ secrets.jenkins_token }}
