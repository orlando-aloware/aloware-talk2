name: Test macOS 14

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: macos-14
    
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: System Information
        run: |
          echo "=== macOS Version ==="
          sw_vers
          echo ""
          echo "=== Architecture ==="
          uname -m
          echo ""
          echo "=== Available SDKs ==="
          xcodebuild -showsdks || true
          echo ""
          echo "=== Xcode Version ==="
          xcodebuild -version || true
          echo ""
          echo "=== Python Version ==="
          python3 --version
          echo ""
          echo "=== Node Version ==="
          node --version || echo "Node not installed"

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      - name: Setup Python3
        uses: actions/setup-python@v4
        with:
          python-version: '3.*'
          architecture: 'x64'

      - name: Install dependencies
        run: yarn install && yarn global add @quasar/cli

      - name: Test Build Command
        run: |
          echo "Testing if basic build setup works..."
          echo "Quasar CLI version:"
          quasar --version

      - name: Summary
        run: |
          echo "✅ macOS 14 runner successfully completed all checks!"
          echo "Architecture: $(uname -m)"
          echo "macOS Version: $(sw_vers -productVersion)"
